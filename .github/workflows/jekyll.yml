# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy personal website to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          path: candidate
      - name: Checkout unchanged live site for isolated preview
        if: github.ref != 'refs/heads/master'
        uses: actions/checkout@v7.0.1
        with:
          ref: master
          path: production
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          working-directory: candidate
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        working-directory: candidate
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Minify unchanged live-site JS
        if: github.ref != 'refs/heads/master'
        working-directory: production
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        if: github.ref == 'refs/heads/master'
        working-directory: candidate
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path }}" --destination "$GITHUB_WORKSPACE/published"
        env:
          JEKYLL_ENV: production
      - name: Build live site plus isolated review preview
        if: github.ref != 'refs/heads/master'
        working-directory: candidate
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --strict_front_matter --source "$GITHUB_WORKSPACE/production" --config "$GITHUB_WORKSPACE/production/_config.yml" --baseurl "${{ steps.pages.outputs.base_path }}" --destination "$GITHUB_WORKSPACE/published"
          bundle exec jekyll build --strict_front_matter --config _config.yml,_config.preview.yml --destination "$GITHUB_WORKSPACE/published/preview/research-refresh"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: published

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
